<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Лабораторная работа 2</title>
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/form.css">
  <link rel="stylesheet" href="css/results.css">
</head>
<body>
<table id="layout">
  <tr>
    <td id="header" colspan="2">Фомин Кирилл Витальевич, группа P3231, вариант 68355633</td>
  </tr>
  <tr>
    <td><canvas id="graph" width="400" height="400"></canvas></td>
    <td>
      <form id="point-form">
  <table id="form-table">
    <tr>
      <td>X:</td>
      <td>
        <button type="button" class="x-btn" value="-4">-4</button>
        <button type="button" class="x-btn" value="-3">-3</button>
        <button type="button" class="x-btn" value="-2">-2</button>
        <button type="button" class="x-btn" value="-1">-1</button>
        <button type="button" class="x-btn" value="0">0</button>
        <button type="button" class="x-btn" value="1">1</button>
        <button type="button" class="x-btn" value="2">2</button>
        <button type="button" class="x-btn" value="3">3</button>
        <button type="button" class="x-btn" value="4">4</button>
      </td>
    </tr>
    <tr>
      <td>Y:</td>
      <td><input type="text" name="y" id="y-input" maxlength="10"></td>
    </tr>
    <tr>
      <td>R:</td>
      <td><input type="text" name="r" id="r-input" maxlength="4"></td>
    </tr>
    <tr>
      <td colspan="2">
        <button type="submit">Проверить</button>
        <div id="error"></div>
      </td>
    </tr>
  </table>
</form>
    </td>
  </tr>
  <tr>
    <td colspan="2">
      <table id="results">
        <thead><tr><th>X</th><th>Y</th><th>R</th><th>Результат</th><th>Время</th><th>Время обработки</th></tr></thead>
        <tbody id="results-body"></tbody>
      </table>
    </td>
  </tr>
</table>
<script src="js/script.js"></script>
</body>
</html>
